<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>document.documentElement.className += ' js';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#170F0F">
<title>CanadaEhPeps</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono/700.css">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1000px; margin:20px auto 0; padding:0 18px;}
  .admin-bar h1{font-size:1.3rem;}
  .admin-bar h1 span{color:var(--rust-deep);}
  .admin-actions{display:flex; gap:8px;}
  .login-wrap{max-width:420px; margin:60px auto; padding:0 18px;}
  .login-card{background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-lg); padding:30px 24px;}
  .login-card h2{margin-bottom:18px;}
  .login-card .field-input{margin-bottom:14px;}
  .login-err{color:var(--rust-deep); font-size:0.82rem; font-weight:700; margin-top:10px; min-height:1em;}
  .dash-wrap{max-width:1000px; margin:0 auto; padding:22px 18px 60px;}
  .summary{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px;}
  .sum-chip{font-family:'Space Mono',monospace; font-size:0.66rem; font-weight:700; background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-pill); padding:8px 16px; color:var(--ink-soft);}
  .sum-chip b{color:var(--rust-deep);}
  .order-card{background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-lg); padding:20px 20px 16px; margin-bottom:16px;}
  .oc-head{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .oc-ref{font-family:'Space Mono',monospace; font-weight:700; font-size:1rem; color:var(--ink);}
  .oc-date{font-family:'Space Mono',monospace; font-size:0.66rem; color:var(--ink-soft);}
  .oc-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px;}
  @media (max-width:640px){ .oc-grid{grid-template-columns:1fr;} }
  .oc-row{display:flex; justify-content:space-between; gap:14px; padding:7px 0; border-bottom:1px dashed rgba(122,43,43,0.2); font-size:0.84rem;}
  .oc-row span:first-child{font-family:'Space Mono',monospace; font-size:0.66rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft); padding-top:2px; white-space:nowrap;}
  .oc-row span:last-child{font-weight:600; text-align:right; word-break:break-word;}
  .oc-status-row{display:flex; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .oc-status-row label{font-family:'Space Mono',monospace; font-size:0.62rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft);}
  .oc-status{padding:9px 14px; border-radius:var(--r-pill); border:2px solid var(--ink); background:var(--bg); color:var(--ink); font-family:'Space Mono',monospace; font-size:0.72rem; font-weight:700; cursor:pointer;}
  .oc-delete{color:var(--rust-deep); border:2px solid var(--rust-deep);}
  .oc-delete:hover{background:var(--rust-deep); color:#fff;}
  .oc-notes{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;}
  .oc-notes textarea{flex:1; min-width:220px; border-radius:var(--r-md); border:2px solid var(--ink); background:var(--bg); color:var(--ink); padding:10px 14px; font-family:'Plus Jakarta Sans',sans-serif; font-size:0.82rem; font-weight:500; min-height:44px; resize:vertical;}
  .empty-note{background:var(--panel); border:2px dashed var(--ink); border-radius:var(--r-lg); padding:36px 24px; text-align:center; color:var(--ink-soft); font-weight:500;}
  .saved-flash{font-family:'Space Mono',monospace; font-size:0.66rem; font-weight:700; color:var(--rust-deep); opacity:0; transition:opacity .3s;}
  .saved-flash.show{opacity:1;}
</style>
</head>
<body>

<div class="admin-bar" id="admin-bar" style="display:none;">
  <h1>🇨🇦 CanadaEhPeps <span>· Orders</span></h1>
  <div class="admin-actions">
    <a class="btn btn-ghost btn-sm" href="buys-admin.html?key=maple2026">Group buys</a>
    <button class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
    <button class="btn btn-primary btn-sm" id="signout-btn">Sign out</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle light / dark theme" aria-pressed="true"><span class="theme-toggle-icon">☽</span></button>
  </div>
</div>

<div class="login-wrap" id="login-view" style="display:none;">
  <div class="login-card">
    <h2>Staff sign-in</h2>
    <input class="field-input" id="login-email" type="email" placeholder="Admin email" autocomplete="username">
    <input class="field-input" id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="login-btn" style="width:100%;">Sign in</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div class="dash-wrap" id="dash-view" style="display:none;">
  <div class="summary" id="summary"></div>
  <div id="orders-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
(function(){
  var STAFF_KEY = 'maple2026';
  var urlKey = new URLSearchParams(window.location.search).get('key');

  if(urlKey !== STAFF_KEY){
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('login-view').innerHTML =
      '<div class="login-card" style="text-align:center;">' +
      '<h2>404</h2>' +
      '<p style="color:var(--ink-soft); font-weight:500;">This page doesn\'t exist, eh.</p>' +
      '<a class="btn btn-primary btn-sm" href="index.html" style="margin-top:16px;">Back to CanadaEhPeps</a>' +
      '</div>';
    return;
  }

  var SUPABASE_URL = 'https://wbarnmxyagkomxndorzd.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_0_6PjuyD0hcS2BGB-dEMTg_G7GuwFCR';
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var STATUSES = ['pending','awaiting payment','paid','packing','shipped','delivered','cancelled','problem'];
  var adminBar = document.getElementById('admin-bar');
  var loginView = document.getElementById('login-view');
  var dashView = document.getElementById('dash-view');
  var refreshBtn = document.getElementById('refresh-btn');
  var signoutBtn = document.getElementById('signout-btn');

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showLogin(){ adminBar.style.display='none'; loginView.style.display='block'; dashView.style.display='none'; }
  function showDash(){ adminBar.style.display='flex'; loginView.style.display='none'; dashView.style.display='block'; }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }

  function renderSummary(orders){
    var total=orders.length;
    var pend=orders.filter(function(o){return o.status==='pending';}).length;
    var aw=orders.filter(function(o){return o.status==='awaiting payment';}).length;
    var paid=orders.filter(function(o){return o.status==='paid'||o.status==='packing';}).length;
    var shipped=orders.filter(function(o){return o.status==='shipped';}).length;
    document.getElementById('summary').innerHTML =
      '<span class="sum-chip">TOTAL <b>'+total+'</b></span>'+
      '<span class="sum-chip">PENDING <b>'+pend+'</b></span>'+
      '<span class="sum-chip">AWAITING PAYMENT <b>'+aw+'</b></span>'+
      '<span class="sum-chip">PAID/PACKING <b>'+paid+'</b></span>'+
      '<span class="sum-chip">SHIPPED <b>'+shipped+'</b></span>';
  }

  function renderOrders(orders){
    var list=document.getElementById('orders-list');
    if(!orders.length){
      list.innerHTML='<div class="empty-note">No orders yet, eh. When a customer submits the order form, it lands here instantly.</div>';
      return;
    }
    list.innerHTML = orders.map(function(o){
      var opts=STATUSES.map(function(s){ return '<option value="'+s+'"'+(o.status===s?' selected':'')+'>'+s+'</option>'; }).join('');
      return '<div class="order-card">'+
        '<div class="oc-head"><span class="oc-ref">'+esc(o.order_ref||'(no ref)')+'</span><span class="oc-date">'+esc(fmtDate(o.created_at))+'</span></div>'+
        '<div class="oc-grid">'+
          '<div class="oc-row"><span>Name</span><span>'+esc(o.customer_name)+'</span></div>'+
          '<div class="oc-row"><span>Email</span><span>'+esc(o.email)+'</span></div>'+
          '<div class="oc-row"><span>Telegram</span><span>'+esc(o.telegram||'—')+'</span></div>'+
          '<div class="oc-row"><span>Product</span><span>'+esc(o.product)+' × '+esc(o.quantity)+'</span></div>'+
          '<div class="oc-row"><span>Coin</span><span>'+esc(o.coin||'—')+'</span></div>'+
          '<div class="oc-row"><span>TXID</span><span>'+(o.txid?esc(o.txid):'—')+'</span></div>'+
          '<div class="oc-row"><span>Ship to</span><span>'+esc(o.ship_address)+', '+esc(o.ship_city)+', '+esc(o.ship_province||'')+' '+esc(o.ship_postal)+', '+esc(o.ship_country)+'</span></div>'+
        '</div>'+
        '<div class="oc-status-row"><label>Status</label><select class="oc-status" data-id="'+o.id+'">'+opts+'</select><span class="saved-flash" id="flash-'+o.id+'">SAVED ✓</span><button class="btn btn-ghost btn-sm oc-delete" data-del-id="'+o.id+'" style="margin-left:auto;">Delete</button></div>'+
        '<div class="oc-notes"><textarea data-notes-id="'+o.id+'" placeholder="Private notes (only you see these)">'+esc(o.admin_notes||'')+'</textarea><button class="btn btn-ghost btn-sm" data-save-id="'+o.id+'">Save notes</button></div>'+
      '</div>';
    }).join('');

    list.querySelectorAll('.oc-status').forEach(function(sel){
      sel.addEventListener('change',function(){
        var id=sel.getAttribute('data-id');
        db.from('orders').update({status:sel.value}).eq('id',id).then(function(r){ if(!r.error){flash(id);} });
      });
    });
    list.querySelectorAll('[data-save-id]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=btn.getAttribute('data-save-id');
        var ta=list.querySelector('[data-notes-id="'+id+'"]');
        db.from('orders').update({admin_notes:ta.value}).eq('id',id).then(function(r){ if(!r.error){flash(id);} });
      });
    });
    list.querySelectorAll('[data-del-id]').forEach(function(btn){
      btn.addEventListener('click',function(){
        var id=btn.getAttribute('data-del-id');
        if(!confirm('Delete this order permanently? This cannot be undone.')) return;
        btn.disabled=true; btn.textContent='Deleting…';
        db.from('orders').delete().eq('id',id).then(function(r){
          if(r.error){ btn.disabled=false; btn.textContent='Delete'; alert('Could not delete: '+r.error.message); return; }
          loadOrders();
        });
      });
    });
  }

  function flash(id){
    var el=document.getElementById('flash-'+id);
    if(!el) return;
    el.classList.add('show');
    setTimeout(function(){ el.classList.remove('show'); },1600);
  }

  function loadOrders(){
    document.getElementById('orders-list').innerHTML='<div class="empty-note">Loading orders…</div>';
    db.from('orders').select('*').order('created_at',{ascending:false}).limit(300).then(function(r){
      if(r.error){ document.getElementById('orders-list').innerHTML='<div class="empty-note">Could not load orders: '+esc(r.error.message)+'</div>'; return; }
      renderSummary(r.data||[]);
      renderOrders(r.data||[]);
    });
  }

  document.getElementById('login-btn').addEventListener('click',function(){
    var email=document.getElementById('login-email').value.trim();
    var pass=document.getElementById('login-pass').value;
    var errEl=document.getElementById('login-err');
    errEl.textContent='';
    db.auth.signInWithPassword({email:email,password:pass}).then(function(r){
      if(r.error){ errEl.textContent='Could not sign in — check the email and password.'; return; }
      showDash(); loadOrders();
    });
  });

  signoutBtn.addEventListener('click',function(){ db.auth.signOut().then(function(){ showLogin(); }); });
  refreshBtn.addEventListener('click',loadOrders);
  document.getElementById('login-pass').addEventListener('keydown',function(e){ if(e.key==='Enter'){ document.getElementById('login-btn').click(); } });

  db.auth.getSession().then(function(r){
    if(r.data && r.data.session){ showDash(); loadOrders(); } else { showLogin(); }
  });
})();
</script>
</body>
</html>
