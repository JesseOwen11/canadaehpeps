<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<script>document.documentElement.className += ' js';</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#170F0F">
<title>CanadaEhPeps</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/baloo-2/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans/600.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/plus-jakarta-sans/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-mono/700.css">
<link rel="stylesheet" href="styles.css">
<style>
  .admin-bar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; max-width:1100px; margin:20px auto 0; padding:0 18px;}
  .admin-bar h1{font-size:1.3rem; display:flex; align-items:center; gap:10px;}
  .admin-bar h1 span.tint{color:var(--rust-deep);}
  .h-flag{display:inline-block; width:36px; height:18px; background:var(--flag) center/cover no-repeat; border-radius:2px; box-shadow:0 0 0 1px rgba(0,0,0,0.15);}
  .admin-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .login-wrap{max-width:420px; margin:60px auto; padding:0 18px;}
  .login-card{background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-lg); padding:30px 24px;}
  .login-card h2{margin-bottom:18px;}
  .login-card .field-input{margin-bottom:14px;}
  .login-err{color:var(--rust-deep); font-size:0.82rem; font-weight:700; margin-top:10px; min-height:1em;}
  .dash-wrap{max-width:1100px; margin:0 auto; padding:22px 18px 60px;}

  .admin-tabs{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:20px;}
  .admin-tab{
    font-family:'Space Mono',monospace; font-size:0.78rem; font-weight:700; cursor:pointer;
    padding:12px 24px; border-radius:var(--r-pill); border:2px solid var(--ink);
    background:var(--panel); color:var(--ink-soft); transition:all .15s;
  }
  .admin-tab.active{background:var(--plum); color:#fff; border-color:var(--plum);}

  .pills{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px;}
  .pill{
    font-family:'Space Mono',monospace; font-size:0.68rem; font-weight:700; cursor:pointer;
    padding:9px 14px; border-radius:var(--r-pill); border:2px solid var(--ink);
    background:var(--panel); color:var(--ink-soft); transition:all .15s;
  }
  .pill .cnt{margin-left:6px; color:var(--rust-deep);}
  .pill.active{background:var(--rust-deep); color:#fff; border-color:var(--rust-deep);}
  .pill.active .cnt{color:#fff;}

  .order-card{background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-lg); padding:18px 20px; margin-bottom:14px;}
  .oc-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:10px;}
  .oc-ref{font-family:'Space Mono',monospace; font-weight:700; font-size:1rem;}
  .oc-date{font-family:'Space Mono',monospace; font-size:0.62rem; color:var(--ink-soft);}
  .oc-grid{display:grid; grid-template-columns:1fr 1fr; gap:4px 24px;}
  @media (max-width:640px){ .oc-grid{grid-template-columns:1fr;} }
  .oc-row{display:flex; justify-content:space-between; gap:14px; padding:6px 0; border-bottom:1px dashed rgba(122,43,43,0.2); font-size:0.84rem;}
  .oc-row span:first-child{font-family:'Space Mono',monospace; font-size:0.62rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft); padding-top:2px; white-space:nowrap;}
  .oc-row span:last-child{font-weight:600; text-align:right; word-break:break-word;}
  .oc-controls{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .oc-controls label{font-family:'Space Mono',monospace; font-size:0.6rem; font-weight:700; text-transform:uppercase; color:var(--ink-soft);}
  .oc-status{padding:9px 14px; border-radius:var(--r-pill); border:2px solid var(--ink); background:var(--bg); color:var(--ink); font-family:'Space Mono',monospace; font-size:0.7rem; font-weight:700; cursor:pointer;}
  .oc-del{color:var(--rust-deep); border:2px solid var(--rust-deep);}
  .oc-del:hover{background:var(--rust-deep); color:#fff;}
  .saved-flash{font-family:'Space Mono',monospace; font-size:0.64rem; font-weight:700; color:var(--rust-deep); opacity:0; transition:opacity .3s;}
  .saved-flash.show{opacity:1;}
  .empty-note{background:var(--panel); border:2px dashed var(--ink); border-radius:var(--r-lg); padding:36px 24px; text-align:center; color:var(--ink-soft); font-weight:500;}

  .user-card{background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-lg); padding:16px 20px; margin-bottom:12px;}
  .uc-head{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .uc-email{font-family:'Space Mono',monospace; font-weight:700; font-size:0.9rem;}
  .uc-badge{font-family:'Space Mono',monospace; font-size:0.58rem; font-weight:700; padding:4px 10px; border-radius:var(--r-pill); background:var(--rust); color:#fff;}
  .uc-badge.staff{background:var(--rust-deep);}
  .uc-sub{font-size:0.76rem; color:var(--ink-soft); margin-top:6px; font-weight:500;}
  .uc-actions{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}
  .uc-actions .btn{padding:8px 16px; font-size:0.78rem; width:auto; min-height:auto;}

  .bp-card{background:var(--panel); border:2px solid var(--ink); border-radius:var(--r-lg); padding:18px 20px; margin-bottom:14px;}
  .bp-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  @media (max-width:640px){ .bp-grid{grid-template-columns:1fr;} }
  .bp-field label{display:block; font-family:'Space Mono',monospace; font-size:0.58rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-soft); margin:0 0 5px 12px;}
  .bp-field input,.bp-field textarea{width:100%; padding:11px 16px; border-radius:var(--r-pill); border:2px solid var(--ink); background:var(--bg); color:var(--ink); font-family:'Space Mono',monospace; font-size:0.8rem;}
  .bp-field textarea{border-radius:var(--r-md); min-height:52px; resize:vertical; font-family:'Plus Jakarta Sans',sans-serif; font-weight:500;}
  .bp-field.wide{grid-column:1 / -1;}
  .bp-actions{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;}
  .bp-actions .btn{padding:9px 18px; font-size:0.8rem; width:auto; min-height:auto;}
  .bp-hint{font-size:0.72rem; color:var(--ink-soft); font-weight:500; margin-bottom:14px;}
</style>
</head>
<body>

<div class="admin-bar" id="admin-bar" style="display:none;">
  <h1><span class="h-flag"></span> CanadaEhPeps <span class="tint">· Bulk Orders</span></h1>
  <div class="admin-actions">
    <a class="btn btn-ghost btn-sm" href="buys-admin.html?key=maple2026">Group buys</a>
    <button class="btn btn-ghost btn-sm" id="refresh-btn">Refresh</button>
    <button class="btn btn-primary btn-sm" id="signout-btn">Sign out</button>
    <button class="icon-btn" id="theme-toggle" aria-label="Toggle light / dark theme" aria-pressed="true"><span class="theme-toggle-icon">☽</span></button>
  </div>
</div>

<div class="login-wrap" id="login-view" style="display:none;">
  <div class="login-card">
    <h2>Staff sign-in</h2>
    <input class="field-input" id="login-email" type="email" placeholder="Admin email" autocomplete="username">
    <input class="field-input" id="login-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn btn-primary" id="login-btn" style="width:100%;">Sign in</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<div class="dash-wrap" id="dash-view" style="display:none;">

  <div class="admin-tabs">
    <button class="admin-tab active" id="tab-orders-btn" type="button">Bulk orders</button>
    <button class="admin-tab" id="tab-products-btn" type="button">Bulk products</button>
    <button class="admin-tab" id="tab-users-btn" type="button">User accounts</button>
  </div>

  <!-- BULK ORDERS TAB -->
  <div id="orders-tab">
    <div class="pills" id="status-pills">
      <button class="pill active" data-filter="all">Total <span class="cnt">0</span></button>
      <button class="pill" data-filter="pending">Pending <span class="cnt">0</span></button>
      <button class="pill" data-filter="awaiting payment">Awaiting payment <span class="cnt">0</span></button>
      <button class="pill" data-filter="paid">Paid <span class="cnt">0</span></button>
      <button class="pill" data-filter="packing">Packing <span class="cnt">0</span></button>
      <button class="pill" data-filter="shipped">Shipped <span class="cnt">0</span></button>
      <button class="pill" data-filter="delivered">Delivered <span class="cnt">0</span></button>
    </div>
    <div id="orders-list"><div class="empty-note">Loading…</div></div>
  </div>

  <!-- BULK PRODUCTS TAB -->
  <div id="products-tab" style="display:none;">
    <p class="bp-hint">These products appear on the public <b>Bulk Orders</b> page. Leave price blank to show <b>$--</b> (price confirmed at review). Changes go live the moment you save.</p>
    <button class="btn btn-primary btn-sm" id="add-product-btn" style="margin-bottom:16px;">+ Add product</button>
    <div id="products-list"><div class="empty-note">Loading…</div></div>
  </div>

  <!-- USER ACCOUNTS TAB -->
  <div id="users-tab" style="display:none;">
    <div id="users-list"><div class="empty-note">Loading…</div></div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script>
/* Bulk orders admin — orders, products manager, user accounts */
(function(){
  var STAFF_KEY = 'maple2026';
  var urlKey = new URLSearchParams(window.location.search).get('key');

  if(urlKey !== STAFF_KEY){
    document.getElementById('login-view').style.display = 'block';
    document.getElementById('login-view').innerHTML =
      '<div class="login-card" style="text-align:center;">' +
      '<h2>404</h2>' +
      '<p style="color:var(--ink-soft); font-weight:500;">This page doesn\'t exist, eh.</p>' +
      '<a class="btn btn-primary btn-sm" href="index.html" style="margin-top:16px;">Back to CanadaEhPeps</a>' +
      '</div>';
    return;
  }

  var SUPABASE_URL = 'https://wbarnmxyagkomxndorzd.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_0_6PjuyD0hcS2BGB-dEMTg_G7GuwFCR';
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  /* EXACT statuses the database allows — do not change spellings */
  var STATUSES = ['pending','awaiting payment','paid','packing','shipped','delivered','cancelled','problem'];
  var STATUS_LABEL = {
    'pending':'Pending',
    'awaiting payment':'Awaiting payment',
    'paid':'Paid',
    'packing':'Packing',
    'shipped':'Shipped',
    'delivered':'Delivered',
    'cancelled':'Cancelled',
    'problem':'Problem'
  };

  var adminBar = document.getElementById('admin-bar');
  var loginView = document.getElementById('login-view');
  var dashView = document.getElementById('dash-view');
  var allOrders = [];
  var activeFilter = 'all';

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function showLogin(){ adminBar.style.display='none'; loginView.style.display='block'; dashView.style.display='none'; }
  function showDash(){ adminBar.style.display='flex'; loginView.style.display='none'; dashView.style.display='block'; }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString(); }catch(e){ return iso; } }

  /* ---- tabs ---- */
  var TABS = ['orders','products','users'];
  function switchTab(name){
    TABS.forEach(function(t){
      document.getElementById(t + '-tab').style.display = (t === name) ? 'block' : 'none';
      document.getElementById('tab-' + t + '-btn').classList.toggle('active', t === name);
    });
  }
  document.getElementById('tab-orders-btn').addEventListener('click', function(){ switchTab('orders'); });
  document.getElementById('tab-products-btn').addEventListener('click', function(){ switchTab('products'); });
  document.getElementById('tab-users-btn').addEventListener('click', function(){ switchTab('users'); });

  /* ---- status filter pills ---- */
  function updateCounts(){
    var counts = { 'all': allOrders.length, 'pending':0, 'awaiting payment':0, 'paid':0, 'packing':0, 'shipped':0, 'delivered':0 };
    allOrders.forEach(function(o){
      if(counts.hasOwnProperty(o.status)) counts[o.status]++;
    });
    document.querySelectorAll('#status-pills .pill').forEach(function(pill){
      var f = pill.getAttribute('data-filter');
      pill.querySelector('.cnt').textContent = counts[f];
    });
  }
  document.querySelectorAll('#status-pills .pill').forEach(function(pill){
    pill.addEventListener('click', function(){
      activeFilter = pill.getAttribute('data-filter');
      document.querySelectorAll('#status-pills .pill').forEach(function(p){ p.classList.remove('active'); });
      pill.classList.add('active');
      renderOrders();
    });
  });

  /* ---- orders ---- */
  function renderOrders(){
    var list = document.getElementById('orders-list');
    var filtered = activeFilter === 'all' ? allOrders : allOrders.filter(function(o){ return o.status === activeFilter; });
    if(!filtered.length){
      list.innerHTML = '<div class="empty-note">' + (allOrders.length ? 'No orders in this status, eh.' : 'No orders yet, eh.') + '</div>';
      return;
    }
    list.innerHTML = filtered.map(function(o){
      var opts = STATUSES.map(function(s){
        return '<option value="' + s + '"' + (o.status === s ? ' selected' : '') + '>' + STATUS_LABEL[s] + '</option>';
      }).join('');
      return '<div class="order-card">' +
        '<div class="oc-head"><span class="oc-ref">' + esc(o.order_ref) + '</span><span class="oc-date">' + esc(fmtDate(o.created_at)) + '</span></div>' +
        '<div class="oc-grid">' +
          '<div class="oc-row"><span>Product</span><span>' + esc(o.product) + '</span></div>' +
          '<div class="oc-row"><span>Qty</span><span>' + esc(o.quantity) + '</span></div>' +
          '<div class="oc-row"><span>Customer</span><span>' + esc(o.customer_name) + '</span></div>' +
          '<div class="oc-row"><span>Email</span><span>' + esc(o.email) + '</span></div>' +
          '<div class="oc-row"><span>Coin</span><span>' + esc(o.coin || '—') + '</span></div>' +
          '<div class="oc-row"><span>TXID</span><span>' + esc(o.txid || '—') + '</span></div>' +
          '<div class="oc-row"><span>Ship to</span><span>' + esc([o.ship_address, o.ship_city, o.ship_postal, o.ship_country].filter(Boolean).join(', ') || '—') + '</span></div>' +
          (o.buy_code ? '<div class="oc-row"><span>Buy</span><span>' + esc(o.buy_code) + '</span></div>' : '') +
        '</div>' +
        (o.admin_notes ? '<div class="oc-row" style="border-bottom:none;"><span>Notes</span><span>' + esc(o.admin_notes) + '</span></div>' : '') +
        '<div class="oc-controls">' +
          '<label>Status</label>' +
          '<select class="oc-status" data-id="' + o.id + '">' + opts + '</select>' +
          '<span class="saved-flash" id="flash-' + o.id + '">SAVED ✓</span>' +
          '<button class="btn btn-ghost btn-sm oc-del" data-del-id="' + o.id + '" style="margin-left:auto;">Delete</button>' +
        '</div>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.oc-status').forEach(function(sel){
      sel.addEventListener('change', function(){
        var id = sel.getAttribute('data-id');
        db.from('orders').update({ status: sel.value }).eq('id', id).then(function(r){
          if(!r.error){
            var el = document.getElementById('flash-' + id);
            if(el){ el.classList.add('show'); setTimeout(function(){ el.classList.remove('show'); }, 1600); }
            loadOrders();
          } else { alert('Could not update: ' + r.error.message); }
        });
      });
    });
    list.querySelectorAll('.oc-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-del-id');
        if(!confirm('Delete this order permanently? This cannot be undone.')) return;
        btn.disabled = true; btn.textContent = 'Deleting…';
        db.from('orders').delete().eq('id', id).then(function(r){
          if(r.error){ btn.disabled = false; btn.textContent = 'Delete'; alert('Could not delete: ' + r.error.message); return; }
          loadOrders();
        });
      });
    });
  }

  function loadOrders(){
    var list = document.getElementById('orders-list');
    list.innerHTML = '<div class="empty-note">Loading…</div>';
    db.from('orders').select('*').order('created_at', { ascending: false }).limit(200).then(function(r){
      if(r.error){ list.innerHTML = '<div class="empty-note">Could not load orders: ' + esc(r.error.message) + '</div>'; return; }
      allOrders = r.data || [];
      updateCounts();
      renderOrders();
    });
  }

  /* ---- bulk products manager ---- */
  function productCard(p){
    var id = p ? p.id : '';
    return '<div class="bp-card" data-id="' + esc(id) + '">' +
      '<div class="bp-grid">' +
        '<div class="bp-field"><label>Product name</label><input class="bp-name" type="text" maxlength="100" value="' + esc(p ? p.name : '') + '" placeholder="MOTS-C"></div>' +
        '<div class="bp-field"><label>Size label</label><input class="bp-size" type="text" maxlength="60" value="' + esc(p ? p.size_label : '') + '" placeholder="10mg vial"></div>' +
        '<div class="bp-field"><label>Price CAD (blank = $--)</label><input class="bp-price" type="number" min="0" step="0.01" value="' + (p && p.price_cad !== null && p.price_cad !== undefined ? esc(p.price_cad) : '') + '" placeholder="blank = price on request"></div>' +
        '<div class="bp-field"><label>Sort order</label><input class="bp-sort" type="number" min="0" max="999" value="' + (p ? esc(p.sort) : '') + '" placeholder="' + (p ? '' : 'auto') + '"></div>' +
        '<div class="bp-field wide"><label>Description</label><textarea class="bp-desc" maxlength="300" placeholder="Batch-tested. Price confirmed at order review.">' + esc(p ? (p.description || '') : '') + '</textarea></div>' +
      '</div>' +
      '<div class="bp-actions">' +
        '<button class="btn btn-primary btn-sm bp-save" type="button">' + (p ? 'Save changes' : 'Add product') + '</button>' +
        (p ? '<button class="btn btn-ghost btn-sm oc-del bp-delete" type="button">Remove from store</button>' : '<button class="btn btn-ghost btn-sm oc-del bp-cancel" type="button">Cancel</button>') +
        '<span class="saved-flash bp-flash">SAVED ✓</span>' +
      '</div>' +
    '</div>';
  }

  function renderProducts(list){
    var box = document.getElementById('products-list');
    if(!list.length){
      box.innerHTML = '<div class="empty-note">No products yet, eh. Click "+ Add product" above.</div>';
      return;
    }
    box.innerHTML = list.map(function(p){ return productCard(p); }).join('');
    wireProducts();
  }

  function wireProducts(){
    var box = document.getElementById('products-list');

    box.querySelectorAll('.bp-save').forEach(function(btn){
      btn.addEventListener('click', function(){
        var card = btn.closest('.bp-card');
        var name = card.querySelector('.bp-name').value.trim();
        var size = card.querySelector('.bp-size').value.trim() || '10mg vial';
        var priceRaw = card.querySelector('.bp-price').value.trim();
        var sortRaw = card.querySelector('.bp-sort').value.trim();
        var desc = card.querySelector('.bp-desc').value.trim() || null;
        if(!name){ alert('Give the product a name, eh.'); return; }
        var price = priceRaw === '' ? null : parseFloat(priceRaw);
        if(price !== null && (isNaN(price) || price < 0)){ alert('Price must be a valid number (or left blank).'); return; }
        var sort = sortRaw === '' ? null : parseInt(sortRaw, 10);
        if(sort !== null && (isNaN(sort) || sort < 0)){ sort = null; }

        var id = card.getAttribute('data-id');
        btn.disabled = true; btn.textContent = 'Saving…';

        function doSave(payload){
          var req = id ? db.from('bulk_products').update(payload).eq('id', id)
                       : db.from('bulk_products').insert(payload);
          req.then(function(r){
            btn.disabled = false; btn.textContent = id ? 'Save changes' : 'Add product';
            if(r.error){ alert('Could not save: ' + r.error.message); return; }
            loadProducts();
          });
        }

        if(sort === null && !id){
          db.from('bulk_products').select('sort').order('sort', { ascending: false }).limit(1).then(function(r){
            var next = 1;
            if(r.data && r.data.length && r.data[0].sort !== null){ next = Number(r.data[0].sort) + 1; }
            doSave({ name: name, size_label: size, price_cad: price, description: desc, sort: next, active: true });
          });
        } else {
          var payload = { name: name, size_label: size, price_cad: price, description: desc, active: true };
          if(sort !== null){ payload.sort = sort; }
          doSave(payload);
        }
      });
    });

    box.querySelectorAll('.bp-delete').forEach(function(btn){
      btn.addEventListener('click', function(){
        var card = btn.closest('.bp-card');
        var id = card.getAttribute('data-id');
        if(!confirm('Remove this product from the store? This cannot be undone.')) return;
        btn.disabled = true; btn.textContent = 'Removing…';
        db.from('bulk_products').delete().eq('id', id).then(function(r){
          if(r.error){ btn.disabled = false; btn.textContent = 'Remove from store'; alert('Could not remove: ' + r.error.message); return; }
          loadProducts();
        });
      });
    });

    box.querySelectorAll('.bp-cancel').forEach(function(btn){
      btn.addEventListener('click', function(){ loadProducts(); });
    });
  }

  function loadProducts(){
    var box = document.getElementById('products-list');
    box.innerHTML = '<div class="empty-note">Loading…</div>';
    db.from('bulk_products').select('*').order('sort', { ascending: true }).limit(200).then(function(r){
      if(r.error){ box.innerHTML = '<div class="empty-note">Could not load products: ' + esc(r.error.message) + '</div>'; return; }
      renderProducts(r.data || []);
    });
  }

  document.getElementById('add-product-btn').addEventListener('click', function(){
    var box = document.getElementById('products-list');
    var tmp = document.createElement('div');
    tmp.innerHTML = productCard(null);
    box.insertBefore(tmp.firstChild, box.firstChild);
    wireProducts();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* ---- user accounts ---- */
  function loadUsers(){
    var list = document.getElementById('users-list');
    list.innerHTML = '<div class="empty-note">Loading…</div>';
    db.from('profiles').select('*').order('created_at', { ascending: false }).limit(300).then(function(r){
      if(r.error){ list.innerHTML = '<div class="empty-note">Could not load accounts: ' + esc(r.error.message) + '</div>'; return; }
      var users = r.data || [];
      if(!users.length){ list.innerHTML = '<div class="empty-note">No accounts yet, eh.</div>'; return; }
      list.innerHTML = users.map(function(u){
        return '<div class="user-card">' +
          '<div class="uc-head">' +
            '<span class="uc-email">' + esc(u.email || u.id) + '</span>' +
            '<span class="uc-badge' + (u.is_staff ? ' staff' : '') + '">' + (u.is_staff ? 'STAFF' : 'CUSTOMER') + '</span>' +
          '</div>' +
          '<div class="uc-sub">' +
            (u.display_name ? 'Name: ' + esc(u.display_name) + ' · ' : '') +
            'Joined ' + esc(fmtDate(u.created_at)) +
          '</div>' +
          '<div class="uc-actions">' +
            '<button class="btn btn-ghost btn-sm" data-reset="' + esc(u.email || '') + '">Send password reset</button>' +
            '<button class="btn btn-ghost btn-sm oc-del" data-deluser="' + u.id + '">Delete account data</button>' +
          '</div>' +
        '</div>';
      }).join('');

      list.querySelectorAll('[data-reset]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var email = btn.getAttribute('data-reset');
          if(!email){ alert('This account has no email on file.'); return; }
          btn.disabled = true; btn.textContent = 'Sending…';
          db.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/account.html' }).then(function(r){
            btn.disabled = false; btn.textContent = 'Send password reset';
            if(r.error){ alert('Could not send reset: ' + r.error.message); return; }
            alert('Password reset email sent to ' + email + '.');
          });
        });
      });
      list.querySelectorAll('[data-deluser]').forEach(function(btn){
        btn.addEventListener('click', function(){
          var id = btn.getAttribute('data-deluser');
          if(!confirm('Delete this account\'s profile and order data? This cannot be undone.')) return;
          btn.disabled = true; btn.textContent = 'Deleting…';
          db.from('orders').delete().eq('user_id', id).then(function(){
            db.from('profiles').delete().eq('id', id).then(function(r){
              if(r.error){ btn.disabled = false; btn.textContent = 'Delete account data'; alert('Could not delete: ' + r.error.message); return; }
              loadUsers();
            });
          });
        });
      });
    });
  }

  /* ---- auth ---- */
  document.getElementById('login-btn').addEventListener('click', function(){
    var email = document.getElementById('login-email').value.trim();
    var pass = document.getElementById('login-pass').value;
    var errEl = document.getElementById('login-err');
    errEl.textContent = '';
    db.auth.signInWithPassword({ email: email, password: pass }).then(function(r){
      if(r.error){ errEl.textContent = 'Could not sign in — check the email and password.'; return; }
      showDash();
      loadOrders();
      loadProducts();
      loadUsers();
    });
  });
  document.getElementById('signout-btn').addEventListener('click', function(){ db.auth.signOut().then(function(){ showLogin(); }); });
  document.getElementById('refresh-btn').addEventListener('click', function(){ loadOrders(); loadProducts(); loadUsers(); });
  document.getElementById('login-pass').addEventListener('keydown', function(e){ if(e.key === 'Enter'){ document.getElementById('login-btn').click(); } });

  /* Simple session check — page is never blank. */
  showLogin();
  db.auth.getSession().then(function(r){
    if(r.data && r.data.session){ showDash(); loadOrders(); loadProducts(); loadUsers(); }
  }).catch(function(){ /* stay on sign-in */ });
})();
</script>
</body>
</html>
